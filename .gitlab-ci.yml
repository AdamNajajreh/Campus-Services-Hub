stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: your-dockerhub-username/user-service
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_REGISTRY: docker.io

# -----------------------------
# 1️⃣ Test Stage
# -----------------------------
test:
  stage: test
  image: python:3.9
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m pytest test_user-service.py
  only:
    - branches

# -----------------------------
# 2️⃣ Build Stage
# -----------------------------
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD"
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
  only:
    - branches

# -----------------------------
# 3️⃣ Deploy Stage (optional)
# -----------------------------
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "$EC2_SSH_PRIVATE_KEY" > key.pem
    - chmod 600 key.pem
    - ssh -o StrictHostKeyChecking=no ec2-user@$EC2_IP "docker pull $DOCKER_IMAGE:$DOCKER_TAG && docker stop user-service || true && docker rm user-service || true && docker run -d -p 5000:5000 --name user-service $DOCKER_IMAGE:$DOCKER_TAG"
  only:
    - main
