services:
  user-postgres:
    image: postgres:15-alpine
    container_name: user-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5435:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
      - ./init-user.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-postgres:
    image: postgres:15-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_db
    ports:
      - "5433:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  request-postgres:
    image: postgres:15-alpine
    container_name: request-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: request_db
    ports:
      - "5434:5432"
    volumes:
      - request-db-data:/var/lib/postgresql/data
      - ./init-request.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-postgres:
    image: postgres:15-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_db
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
      - ./init-noti.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    image: user-service:latest
    container_name: user-service
    ports:
      - "5000:5000"
    environment:
      DB_HOST: user-postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: user_db
      DB_PORT: 5432
      PORT: 5000
      DEBUG: "False"
      SECRET_KEY: campus-services-secret-key
    depends_on:
      user-postgres:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    image: booking-service:latest
    container_name: booking-service
    ports:
      - "5001:5001"
    environment:
      DB_HOST: booking-postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: booking_db
      DB_PORT: 5432
      PORT: 5001
      DEBUG: "False"
      USER_SERVICE_URL: http://user-service:5000
      NOTIFICATION_SERVICE_URL: http://notification-service:5003
      SECRET_KEY: campus-services-secret-key
    depends_on:
      booking-postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: unless-stopped

  request-service:
    image: request-service:latest
    container_name: request-service
    ports:
      - "5002:5002"
    environment:
      DB_HOST: request-postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: request_db
      DB_PORT: 5432
      PORT: 5002
      DEBUG: "False"
      USER_SERVICE_URL: http://user-service:5000
      NOTIFICATION_SERVICE_URL: http://notification-service:5003
      SECRET_KEY: campus-services-secret-key
    depends_on:
      request-postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    image: notification-service:latest
    container_name: notification-service
    ports:
      - "5003:5003"
    environment:
      DB_HOST: notification-postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: notification_db
      DB_PORT: 5432
      PORT: 5003
      DEBUG: "False"
      SECRET_KEY: campus-services-secret-key
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: ""
      EMAIL_PASSWORD: ""
      FROM_EMAIL: noreply@campus.edu
    depends_on:
      notification-postgres:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DEBUG: "False"
      SECRET_KEY: campus-services-secret-key
      USER_SERVICE_URL: http://user-service:5000
      REQUEST_SERVICE_URL: http://request-service:5002
      BOOKING_SERVICE_URL: http://booking-service:5001
      NOTIFICATION_SERVICE_URL: http://notification-service:5003
      RATE_LIMIT_ENABLED: "True"
      RATE_LIMIT_PER_MINUTE: 100
      REQUEST_TIMEOUT: 30
    depends_on:
      - user-service
      - booking-service
      - request-service
      - notification-service
    restart: unless-stopped

  frontend-service:
    image: frontend-service:latest
    container_name: frontend-service
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  user-db-data:
  booking-db-data:
  request-db-data:
  notification-db-data:
